name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1

      - name: Install dependencies
        run: npm ci

      - name: Build, verify & publish
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
            umask 077
            export APPLE_API_KEY="$RUNNER_TEMP/sumi-api-key.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          fi
          unset APPLE_API_KEY_CONTENT
          npm run release

      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sumi-api-key.p8"
